enemy_color: "red"
# enemy_color: "blue"

#####-----神经网络参数-----#####
# Jetson / CUDA DNN 示例配置：所有模型必须是 .onnx（OpenVINO IR .xml 需要 ENABLE_OPENVINO）
yolo_name: yolo11
classify_model: assets/tiny_resnet.onnx
# 注意：best2-sim.onnx 的实际输出是 4 框 + 1 类 + 5 关键点（5x2=10 通道），
# 与当前 yolo11 适配器（4 框 + nc 类 + 4 关键点）不兼容，不能直接用于识别。
# 需要新赛季 5 关键点目标时请新增适配器，不要只改 class_num。
yolo11_model_path: assets/yolo11_dnn.onnx
yolov8_model_path: assets/yolov8.onnx
yolov5_model_path: assets/yolov5.onnx
# GPU -> OpenCV DNN CUDA FP16；CPU -> OpenCV DNN CPU
device: GPU
# yolo11_dnn.onnx 输出 (1, 50, 8400) = 4 + 38 类 + 8 关键点
class_num: 38
min_confidence: 0.8
use_traditional: true

#####-----ROI-----#####
roi:
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false

#####-----传统方法参数-----#####
threshold: 150
max_angle_error: 45 # degree
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25 # degree

#####-----tracker参数-----#####
min_detect_count: 5
max_temp_lost_count: 15
outpost_max_temp_lost_count: 75

#####-----aimer参数-----#####
yaw_offset: 1.6 # degree -2.5
pitch_offset: 11.4 # degree 2
comming_angle: 55 # degree
leaving_angle: 20 # degree
decision_speed: 7 # rad/s
high_speed_delay_time: 0.0 # s
low_speed_delay_time: 0.0 # s planner use this value

#####-----shooter参数-----#####
first_tolerance: 3 # 近距离射击容差，degree
second_tolerance: 2 # 远距离射击容差，degree
judge_distance: 2 #距离判断阈值
auto_fire: true # 是否由自瞄控制射击

camera_name: "hikrobot"
exposure_ms: 2.5
gain: 16.9
vid_pid: "2bdf:0001"

#  1  0  0
#  0  1  0
#  0  0  1
R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]

# 重投影误差: 0.1820px
camera_matrix: [1785.4881526822305, 0, 672.4806478241826, 0, 1785.026019470562, 559.89603224794314, 0, 0, 1]
distort_coeffs: [-0.076005079619881746, 0.11182817466388446, 0.0005362204787722057, -0.0027546300984895122, 0]

# 相机同理想情况的偏角: yaw1.44 pitch-7.28 roll0.96 degree
# 标定板到世界坐标系原点的水平距离: 1.13 m
# 标定板同竖直摆放时的偏角: yaw7.61 pitch13.92 roll-0.46 degree
R_camera2gimbal: [-0.027182119030230909, -0.12616154330853446, 0.99163723074269183, -0.99949106557517331, 0.019998323121329122, -0.024853106601381177, -0.016695575474690555, -0.99180811252093692, -0.12664093215554434]
t_camera2gimbal: [0.13160669975045827, 0.10377721766577375, 0.024908271912914642]

#####-----gimbal参数-----#####
# IMPORTANT: ttyUSB numbers are NOT stable across hotplug.
# Replace the example paths with two distinct udev /dev/serial/by-id/...,
# /dev/serial/by-path/... or your own /dev/skywalker/* stable symlinks.
# See docs/serial-hotplug.md before deploying.
com_port: "/dev/ttyUSB0"       # EXAMPLE ONLY: gimbal
nav_com_port: "/dev/ttyUSB1"   # EXAMPLE ONLY: navigation
yaw_kp: 0
yaw_kd: 0
pitch_kp: 0
pitch_kd: 0

#####-----planner-----#####
fire_thresh: 0.0035

max_yaw_acc: 50
Q_yaw: [9e6, 0]
R_yaw: [1]

max_pitch_acc: 100
Q_pitch: [9e6, 0]
R_pitch: [1]

#####-----buff_detector参数-----#####
model: "assets/yolo11_buff_int8.xml"

#####-----buff_aimer参数-----#####
fire_gap_time: 0.700   # s
predict_time: 0.120     # s