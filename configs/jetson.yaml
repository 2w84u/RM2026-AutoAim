enemy_color: "red"
# enemy_color: "blue"

#####-----神经网络参数-----#####
# Jetson / CUDA DNN 示例配置：所有模型必须是 .onnx（OpenVINO IR .xml 需要 ENABLE_OPENVINO）
yolo_name: yolo11
classify_model: assets/tiny_resnet.onnx
yolo11_model_path: assets/best2-sim.onnx
yolov8_model_path: assets/yolov8.onnx
yolov5_model_path: assets/yolov5.onnx
# GPU -> OpenCV DNN CUDA FP16；CPU -> OpenCV DNN CPU
device: GPU
# 2027 迁移模型（best2-sim.onnx）输出为 (1, 15, 8400) = 4 + 3 类 + 8 关键点
class_num: 3
min_confidence: 0.8
use_traditional: true

#####-----ROI-----#####
roi:
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false

#####-----传统方法参数-----#####
threshold: 150
max_angle_error: 45 # degree
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25 # degree
min_confidence: 0.8

#####-----tracker参数-----#####
min_detect_count: 5
max_temp_lost_count: 15
outpost_max_temp_lost_count: 75

#####-----aimer参数-----#####
yaw_offset: -2 # degree -2.5
pitch_offset: 0 # degree 2
comming_angle: 60 # degree
leaving_angle: 20 # degree
decision_speed: 8 # rad/s
high_speed_delay_time: 0.015 # s
low_speed_delay_time: 0.015 # s

#####-----shooter参数-----#####
first_tolerance: 3 # 近距离射击容差，degree
second_tolerance: 2 # 远距离射击容差，degree
judge_distance: 2 #距离判断阈值
auto_fire: true # 是否由自瞄控制射击

camera_name: "hikrobot"
exposure_ms: 2
gain: 16
vid_pid: "2bdf:0001"
