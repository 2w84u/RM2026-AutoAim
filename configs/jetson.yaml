enemy_color: "red"
# enemy_color: "blue"

#####-----神经网络参数-----#####
# Jetson / CUDA DNN 示例配置：OpenVINO IR .xml 需要 CMake 检测并选择 OpenVINO
yolo_name: yolo11
classify_model: assets/tiny_resnet.onnx
# 注意：best2-sim.onnx 的实际输出是 4 框 + 1 类 + 5 关键点（5x2=10 通道），
# 与当前 yolo11 适配器（4 框 + nc 类 + 4 关键点）不兼容，不能直接用于识别。
# 需要新赛季 5 关键点目标时请新增适配器，不要只改 class_num。
yolo11_model_path: assets/yolo11_dnn.onnx
yolov8_model_path: assets/yolov8.onnx
yolov5_model_path: assets/yolov5.onnx
# TensorRT 后端：需本机已安装 TensorRT，并在 NX 上先执行 scripts/trt/build_engine.sh
# 切换总后端只需把上面的 yolo_name 改成 yolov5_trt
yolov5_trt_model_path: assets/0708_fp16.engine
# GPU -> OpenCV DNN CUDA FP16；CPU -> OpenCV DNN CPU
device: GPU
# yolo11_dnn.onnx 输出 (1, 50, 8400) = 4 + 38 类 + 8 关键点
class_num: 38
min_confidence: 0.8
use_traditional: true

#####-----ROI-----#####
roi:
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false

#####-----传统方法参数-----#####
threshold: 150
max_angle_error: 45 # degree
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25 # degree
min_confidence: 0.8

#####-----tracker参数-----#####
min_detect_count: 5
max_temp_lost_count: 15
outpost_max_temp_lost_count: 75

#####-----aimer参数-----#####
yaw_offset: -2 # degree -2.5
pitch_offset: 0 # degree 2
comming_angle: 60 # degree
leaving_angle: 20 # degree
decision_speed: 8 # rad/s
high_speed_delay_time: 0.015 # s
low_speed_delay_time: 0.015 # s

#####-----shooter参数-----#####
first_tolerance: 3 # 近距离射击容差，degree
second_tolerance: 2 # 远距离射击容差，degree
judge_distance: 2 #距离判断阈值
auto_fire: true # 是否由自瞄控制射击

camera_name: "hikrobot"
exposure_ms: 12
gain: 16
vid_pid: "2bdf:0001"
